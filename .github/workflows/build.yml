# Builds the .deb on every push to main and every PR, including Dependabot's.
# Nothing is published from here; see release.yml.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build .deb
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dpkg-dev python3-cairosvg

      - run: ./packaging/build-deb.sh

      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: geonetmon_*_all.deb
          if-no-files-found: error
          retention-days: 14
